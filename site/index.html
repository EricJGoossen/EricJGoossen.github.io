<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eric J. Goossen</title>
  <meta name="description" content="Portfolio of Eric J. Goossen.">
  <style>
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 36rem; text-align: center; }
    h1 { margin: 0 0 0.25rem; font-size: clamp(2rem, 6vw, 3rem); }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    nav { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover, a:focus-visible { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Eric J. Goossen</h1>
    <p>Portfolio coming soon.</p>
    <nav>
      <a href="https://github.com/EricJGoossen">GitHub</a>
      <a href="https://www.linkedin.com/in/ericjgoossen">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
