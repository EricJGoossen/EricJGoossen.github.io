<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="t d">
  <title id="t">Holding a pose, with and without gravity compensation (simulation)</title>
  <desc id="d">Wrist height of the two simulated OpenArms holding the same reach-out pose with the same joint stiffness. With stiffness alone (blue) the wrist sags from 63 to 43 cm and stays there; with gravity compensation added (orange) it holds at 63 cm. Both are pushed down with 15 N for 0.6 seconds and spring back to where they were.</desc>
