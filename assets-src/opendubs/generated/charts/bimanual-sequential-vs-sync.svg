<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" aria-labelledby="t d">
  <title id="t">One bimanual plan, executed one arm at a time and together</title>
  <desc id="d">The same collision-free plan for both OpenArm arms (22.4 seconds), executed three ways and checked for left-arm-against-right-arm contact at every step. Run one arm after the other, as multi-arm plans used to run, it takes 44.8 seconds and the arms intersect at 97 of 1400 checked states (left first) or 65 of 1400 (right first). Run together from one shared start time, it takes 22.4 seconds with no contact at any of 2798 states.</desc>
