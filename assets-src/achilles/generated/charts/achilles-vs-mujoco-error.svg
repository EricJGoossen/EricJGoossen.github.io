<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="t d">
  <title id="t">Distance between the Achilles and MuJoCo pendulums</title>
  <desc id="d">Distance between the outer link&#x27;s position in Achilles and in MuJoCo over the 8 seconds of the side-by-side clip, on a log scale in millimetres. It stays below 0.03 mm for the first 4 seconds and below 1 mm for 6 seconds, then grows to about 13 mm by 8 seconds, about 1% of the arm&#x27;s reach, as the chaotic swing amplifies single-precision rounding.</desc>
