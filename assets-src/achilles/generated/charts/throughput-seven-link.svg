<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="t d">
  <title id="t">Seven-link arm throughput: Achilles vs MuJoCo</title>
  <desc id="d">Robot-steps per second on one laptop CPU core, by number of robots simulated at once, for a seven-link arm at a 2 ms step. Achilles in single precision (AVX2, eight lanes) rises from 0.75 million at one robot to 5.4 million at 64. Achilles in double precision peaks at 2.7 million. MuJoCo&#x27;s best mode stays between 0.78 and 1.7 million.</desc>
  <style>
    svg { --text:#1c1917; --muted:#6b6560; --grid:#e7e5e4; --axis:#a8a29e;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#6250d6; --ref:#78716c; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#f2f1ef; --muted:#a39d97; --grid:#33312e; --axis:#57534e;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9; --ref:#a8a29e; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); font-size: 13px; }
    .m { fill: var(--muted); } .s { font-size: 12px; } .b { font-weight: 650; }
    .e { text-anchor: end; } .c { text-anchor: middle; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dash { stroke-dasharray: 6 4; }
    .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <line class="grid" x1="64" x2="656" y1="348.0" y2="348.0"/>
  <text class="s m e" x="56" y="352.0">0</text>
  <line class="grid" x1="64" x2="656" y1="301.7" y2="301.7"/>
  <text class="s m e" x="56" y="305.7">1M</text>
  <line class="grid" x1="64" x2="656" y1="255.3" y2="255.3"/>
  <text class="s m e" x="56" y="259.3">2M</text>
  <line class="grid" x1="64" x2="656" y1="209.0" y2="209.0"/>
  <text class="s m e" x="56" y="213.0">3M</text>
  <line class="grid" x1="64" x2="656" y1="162.7" y2="162.7"/>
  <text class="s m e" x="56" y="166.7">4M</text>
  <line class="grid" x1="64" x2="656" y1="116.3" y2="116.3"/>
  <text class="s m e" x="56" y="120.3">5M</text>
  <line class="grid" x1="64" x2="656" y1="70.0" y2="70.0"/>
  <text class="s m e" x="56" y="74.0">6M</text>
  <line class="axis" x1="64" x2="656" y1="348" y2="348"/>
  <text class="s m c" x="64.0" y="366">1</text>
  <text class="s m c" x="162.7" y="366">4</text>
  <text class="s m c" x="261.3" y="366">16</text>
  <text class="s m c" x="360.0" y="366">64</text>
  <text class="s m c" x="458.7" y="366">256</text>
  <text class="s m c" x="557.3" y="366">1,024</text>
  <text class="s m c" x="656.0" y="366">4,096</text>
  <text class="s m c" x="360" y="388">robots simulated at once (log scale)</text>
  <text class="s m" x="56" y="56" text-anchor="start">robot-steps per second</text>
  <polyline class="ln" style="stroke:var(--ref)" stroke-width="2" points="64.0,312.0 162.7,288.2 261.3,275.9 360.0,271.2 458.7,271.0 557.3,274.0 656.0,312.7"/>
  <polyline class="ln" style="stroke:var(--s3)" stroke-width="2" points="64.0,312.1 162.7,251.3 261.3,232.7 360.0,224.7 458.7,227.3 557.3,260.2 656.0,304.8"/>
  <polyline class="ln" style="stroke:var(--s1)" stroke-width="2.5" points="64.0,313.1 162.7,251.4 261.3,120.4 360.0,95.6 458.7,102.7 557.3,136.9 656.0,209.0"/>
  <circle cx="64.0" cy="313.1" r="3.5" style="fill:var(--s1)"/>
  <circle cx="162.7" cy="251.4" r="3.5" style="fill:var(--s1)"/>
  <circle cx="261.3" cy="120.4" r="3.5" style="fill:var(--s1)"/>
  <circle cx="360.0" cy="95.6" r="3.5" style="fill:var(--s1)"/>
  <circle cx="458.7" cy="102.7" r="3.5" style="fill:var(--s1)"/>
  <circle cx="557.3" cy="136.9" r="3.5" style="fill:var(--s1)"/>
  <circle cx="656.0" cy="209.0" r="3.5" style="fill:var(--s1)"/>
  <text class="s b" x="360.0" y="83.6" text-anchor="middle">5.4M, 3.3× MuJoCo</text>
  <line x1="64" x2="84" y1="18" y2="18" style="stroke:var(--s1)" stroke-width="2.5" stroke-linecap="round"/>
  <text class="s" x="90" y="22">Achilles, float (AVX2)</text>
  <line x1="256.4" x2="276.4" y1="18" y2="18" style="stroke:var(--s3)" stroke-width="2.5" stroke-linecap="round"/>
  <text class="s" x="282.4" y="22">Achilles, double (AVX2)</text>
  <line x1="456.0" x2="476.0" y1="18" y2="18" style="stroke:var(--ref)" stroke-width="2.5" stroke-linecap="round"/>
  <text class="s" x="482.0" y="22">MuJoCo 3.15, best mode</text>
</svg>
