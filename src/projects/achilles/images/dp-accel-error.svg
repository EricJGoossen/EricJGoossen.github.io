<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="t d">
  <title id="t">Joint-acceleration error against the closed-form solution</title>
  <desc id="d">Worst relative error of Achilles&#x27; joint accelerations in each tenth of a second over a 10 second double-pendulum run, compared with the closed-form Lagrangian equations of motion. It stays between about 2e-7 and 3e-6, just above float32 precision, with no growth over time.</desc>
