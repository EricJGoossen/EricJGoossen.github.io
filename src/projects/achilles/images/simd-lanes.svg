<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 0 696 383" role="img" aria-labelledby="t d">
  <title id="t">Robots per step by SIMD width</title>
  <desc id="d">Time for one simulation step of a seven-link arm, drawn as one bar per SIMD lane. One robot in the default 4-lane build takes 3.1 microseconds with three lanes idle. Four robots fill those lanes in 4.3 microseconds, 2.9 times the robot-steps per second. Eight robots in the 8-lane AVX2 build take 4.3 microseconds, 5.7 times.</desc>
  <style>
    svg { --text:#1c1917; --muted:#6b6560; --grid:#e7e5e4; --axis:#a8a29e;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#6250d6; --ref:#78716c; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#f2f1ef; --muted:#a39d97; --grid:#33312e; --axis:#57534e;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9; --ref:#a8a29e; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); font-size: 13px; }
    .m { fill: var(--muted); } .s { font-size: 12px; } .b { font-weight: 650; }
    .e { text-anchor: end; } .c { text-anchor: middle; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dash { stroke-dasharray: 6 4; }
    .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <rect x="0" y="16" width="22" height="8" rx="2" style="fill:var(--s1)"/><text class="s" x="30" y="24">lane stepping a robot</text><rect x="200.5" y="16.5" width="21" height="7" rx="2" fill="none" style="stroke:var(--axis)" stroke-dasharray="3 2"/><text class="s" x="230" y="24">idle lane</text>
  <text class="b" x="0" y="96">1 robot</text>
  <text class="s m" x="0" y="114">SSE2 (4 lanes)</text>
  <rect x="196" y="84" width="222.6" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196.5" y="95.5" width="221.6" height="7" rx="2" fill="none" style="stroke:var(--axis)" stroke-dasharray="3 2"/>
  <rect x="196.5" y="106.5" width="221.6" height="7" rx="2" fill="none" style="stroke:var(--axis)" stroke-dasharray="3 2"/>
  <rect x="196.5" y="117.5" width="221.6" height="7" rx="2" fill="none" style="stroke:var(--axis)" stroke-dasharray="3 2"/>
  <text class="s m" x="426.6" y="108.5">3.1 µs</text>
  <text class="b" x="680" y="106.5" text-anchor="end" font-size="20">1×</text>
  <text class="b" x="0" y="171">4 robots</text>
  <text class="s m" x="0" y="189">SSE2 (4 lanes)</text>
  <rect x="196" y="159" width="309.9" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="170" width="309.9" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="181" width="309.9" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="192" width="309.9" height="8" rx="2" style="fill:var(--s1)"/>
  <text class="s m" x="513.9" y="183.5">4.3 µs</text>
  <text class="b" x="680" y="181.5" text-anchor="end" font-size="20">2.9×</text>
  <text class="b" x="0" y="246">8 robots</text>
  <text class="s m" x="0" y="264">AVX2 (8 lanes)</text>
  <rect x="196" y="234" width="310.5" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="245" width="310.5" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="256" width="310.5" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="267" width="310.5" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="278" width="310.5" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="289" width="310.5" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="300" width="310.5" height="8" rx="2" style="fill:var(--s1)"/>
  <rect x="196" y="311" width="310.5" height="8" rx="2" style="fill:var(--s1)"/>
  <text class="s m" x="514.5" y="280.5">4.3 µs</text>
  <text class="b" x="680" y="278.5" text-anchor="end" font-size="20">5.7×</text>
  <line class="axis" x1="196" x2="560" y1="335" y2="335"/>
  <line class="axis" x1="196.0" x2="196.0" y1="335" y2="339"/>
  <text class="s m c" x="196.0" y="353">0</text>
  <line class="axis" x1="268.8" x2="268.8" y1="335" y2="339"/>
  <text class="s m c" x="268.8" y="353">1</text>
  <line class="axis" x1="341.6" x2="341.6" y1="335" y2="339"/>
  <text class="s m c" x="341.6" y="353">2</text>
  <line class="axis" x1="414.4" x2="414.4" y1="335" y2="339"/>
  <text class="s m c" x="414.4" y="353">3</text>
  <line class="axis" x1="487.2" x2="487.2" y1="335" y2="339"/>
  <text class="s m c" x="487.2" y="353">4</text>
  <line class="axis" x1="560.0" x2="560.0" y1="335" y2="339"/>
  <text class="s m c" x="560.0" y="353">5</text>
  <text class="s m c" x="378.0" y="373">time for one step (µs)</text>
  <text class="s m e" x="680" y="44">robot-steps per</text>
  <text class="s m e" x="680" y="59">second, vs 1 robot</text>
</svg>
