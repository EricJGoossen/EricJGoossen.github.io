  <line class="axis" x1="64" x2="656" y1="274" y2="274"/>
  <text class="s m c" x="93.6" y="292">1</text>
  <text class="s m c" x="152.8" y="292">2</text>
  <text class="s m c" x="212.0" y="292">3</text>
  <text class="s m c" x="271.2" y="292">4</text>
  <text class="s m c" x="330.4" y="292">5</text>
  <text class="s m c" x="389.6" y="292">6</text>
  <text class="s m c" x="448.8" y="292">7</text>
