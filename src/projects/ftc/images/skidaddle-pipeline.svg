<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="t d">
  <title id="t">The reworked SKIDADDLE follower</title>
  <desc id="d">Once per path, the path generator flattens a Bézier or Hermite curve into straight arcs and one backward pass precomputes the fastest speed the robot can enter each turn at. Every loop, controllers for progress along the path, for getting back onto it and for heading each request an acceleration with a weight and a priority; the scheduler collects the requests, and the allocator converts them to motor space and hands out each motor’s headroom, highest priority first, shared by weight, before the result goes to the wheels.</desc>
  <style>
    svg { --text:#1c1917; --muted:#6b6560; --grid:#e7e5e4; --axis:#a8a29e;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#6250d6; --ref:#78716c; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#f2f1ef; --muted:#a39d97; --grid:#33312e; --axis:#57534e;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9; --ref:#a8a29e; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); font-size: 13px; }
    .m { fill: var(--muted); } .s { font-size: 12px; } .b { font-weight: 650; }
    .e { text-anchor: end; } .c { text-anchor: middle; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dash { stroke-dasharray: 6 4; }
    .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--axis)"/></marker></defs>
  <text class="s m b" x="16" y="24" letter-spacing="0.06em">ONCE PER PATH</text>
  <rect x="16" y="36" width="210" height="86" rx="8" style="fill:var(--ref);stroke:var(--ref)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="28" y="57">Path generator</text>
  <text class="s m" x="28" y="76">Bézier or Hermite curve,</text>
  <text class="s m" x="28" y="92">flattened into straight arcs</text>
  <text class="s m" x="28" y="108">(De Casteljau subdivision)</text>
  <rect x="260" y="36" width="444" height="86" rx="8" style="fill:var(--s1);stroke:var(--s1)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="272" y="57">Speed limits, precomputed</text>
  <text class="s m" x="272" y="76">one backward pass over every vertex: the fastest speed</text>
  <text class="s m" x="272" y="92">the robot can enter each turn at and still slow down in</text>
  <text class="s m" x="272" y="108">time for the rest of the path</text>
  <line x1="226" y1="79" x2="258" y2="79" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="s m b" x="16" y="160" letter-spacing="0.06em">EVERY LOOP</text>
  <rect x="16" y="172" width="210" height="134" rx="8" style="fill:var(--s4);stroke:var(--s4)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="28" y="193">Controllers</text>
  <text class="s m" x="28" y="212">each asks for an acceleration,</text>
  <text class="s m" x="28" y="228">with a weight and a priority:</text>
  <text class="s m" x="28" y="244">· along the path (convergent)</text>
  <text class="s m" x="28" y="260">· back onto it (transverse)</text>
  <text class="s m" x="28" y="276">· heading</text>
  <rect x="260" y="172" width="220" height="134" rx="8" style="fill:var(--s5);stroke:var(--s5)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="272" y="193">Scheduler</text>
  <text class="s m" x="272" y="212">runs the controllers that</text>
  <text class="s m" x="272" y="228">are active and collects</text>
  <text class="s m" x="272" y="244">their requests; with none</text>
  <text class="s m" x="272" y="260">running, a default</text>
  <text class="s m" x="272" y="276">controller stops the robot</text>
  <rect x="514" y="172" width="190" height="134" rx="8" style="fill:var(--s3);stroke:var(--s3)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="526" y="193">Allocator</text>
  <text class="s m" x="526" y="212">turns requests into motor</text>
  <text class="s m" x="526" y="228">space and hands out each</text>
  <text class="s m" x="526" y="244">motor&#x27;s headroom, highest</text>
  <text class="s m" x="526" y="260">priority first, shared</text>
  <text class="s m" x="526" y="276">by weight</text>
  <line x1="226" y1="239" x2="258" y2="239" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="480" y1="239" x2="512" y2="239" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="370" y1="122" x2="370" y2="170" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="s m" x="378" y="150">the current arc and its speed limit</text>
  <rect x="514" y="340" width="190" height="70" rx="8" style="fill:var(--s2);stroke:var(--s2)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="526" y="361">Wheels</text>
  <text class="s m" x="526" y="380">each motor kept within its</text>
  <text class="s m" x="526" y="396">speed and acceleration caps</text>
  <line x1="609" y1="306" x2="609" y2="338" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="s m" x="16" y="364">Before the rework, one class did all of this, and</text>
  <text class="s m" x="16" y="380">re-ran the look-ahead at every change of segment.</text>
</svg>
