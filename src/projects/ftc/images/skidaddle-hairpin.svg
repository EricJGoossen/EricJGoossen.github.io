<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 486" role="img" aria-labelledby="t d">
  <title id="t">SKIDADDLE, Road Runner and Pedro Pathing around a hairpin</title>
  <desc id="d">Four runs around the same hairpin on one simulated mecanum robot, all starting from rest. Road Runner, 50 in/s² limit: stopped after 8.9 s, 21.9 inches off the path at worst, 0.4 inches from the end. Road Runner, 30 in/s² limit: stopped after 7.2 s, 9.1 inches off the path at worst, 0.1 inches from the end. Pedro Pathing: stopped after 7.2 s, 8.1 inches off the path at worst, 0.0 inches from the end. SKIDADDLE: stopped after 6.5 s, 4.5 inches off the path at worst, 3.1 inches from the end. Road Runner at the 50 limit falls behind in the curve and overshoots the end by about 22 inches before coming back.</desc>
