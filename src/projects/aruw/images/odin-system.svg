<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" role="img" aria-labelledby="t d">
  <title id="t">The characterization system</title>
  <desc id="d">Motion capture and the Odin1 sensor feed the odin-characterization scripts, which record every run and fit the error model into a report. In autonomous mode the scripts send chassis velocities over UDP to project-otto on the Jetson, which forwards them over UART to the sentry&#x27;s MCB; in the default human mode a person drives with the remote and the script only guides.</desc>
  <style>
    svg { --text:#1c1917; --muted:#6b6560; --grid:#e7e5e4; --axis:#a8a29e;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#6250d6; --ref:#78716c; }
    @media screen {
      svg { --text:#f2f1ef; --muted:#a39d97; --grid:#33312e; --axis:#57534e;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9; --ref:#a8a29e; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); font-size: 13px; }
    .m { fill: var(--muted); } .s { font-size: 12px; } .b { font-weight: 650; }
    .e { text-anchor: end; } .c { text-anchor: middle; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dash { stroke-dasharray: 6 4; }
    .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--axis)"/></marker></defs>
  <rect x="16" y="16" width="200" height="70" rx="8" style="fill:var(--ref);stroke:var(--ref)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="28" y="37">Motion capture</text>
  <text class="s m" x="28" y="56">the room&#x27;s cameras: ground</text>
  <text class="s m" x="28" y="72">truth, about 360 Hz</text>
  <rect x="250" y="16" width="220" height="102" rx="8" style="fill:var(--s1);stroke:var(--s1)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="262" y="37">odin-characterization</text>
  <text class="s m" x="262" y="56">guides the driver or drives itself,</text>
  <text class="s m" x="262" y="72">starts and stops Odin, records</text>
  <text class="s m" x="262" y="88">every run, then fits the</text>
  <text class="s m" x="262" y="104">error model</text>
  <rect x="504" y="16" width="200" height="70" rx="8" style="fill:var(--s4);stroke:var(--s4)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="516" y="37">Odin1</text>
  <text class="s m" x="516" y="56">the lidar-inertial sensor</text>
  <text class="s m" x="516" y="72">under test, on the turret</text>
  <line x1="216" y1="51" x2="248" y2="51" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="504" y1="51" x2="472" y2="51" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="250" y="168" width="220" height="70" rx="8" style="fill:var(--s5);stroke:var(--s5)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="262" y="189">project-otto (Jetson)</text>
  <text class="s m" x="262" y="208">UDP → UART bridge, 100 Hz,</text>
  <text class="s m" x="262" y="224">zeros if the script goes quiet</text>
  <line x1="360" y1="118" x2="360" y2="166" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="s m" x="368" y="146" text-anchor="start">chassis velocity, UDP</text>
  <rect x="250" y="290" width="220" height="86" rx="8" style="fill:var(--s3);stroke:var(--s3)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="262" y="311">aruw-mcb (sentry MCB)</text>
  <text class="s m" x="262" y="330">velocity command with a 150 ms</text>
  <text class="s m" x="262" y="346">watchdog and speed caps; holds</text>
  <text class="s m" x="262" y="362">the turret at a fixed yaw</text>
  <line x1="360" y1="238" x2="360" y2="288" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="s m" x="368" y="268" text-anchor="start">UART message 0x14</text>
  <rect x="504" y="168" width="200" height="86" rx="8" style="fill:var(--s2);stroke:var(--s2)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="516" y="189">results/report.md</text>
  <text class="s m" x="516" y="208">static field, Gauss-Markov</text>
  <text class="s m" x="516" y="224">drift, latency, start-up and</text>
  <text class="s m" x="516" y="240">dropout events</text>
  <line x1="470" y1="100" x2="560" y2="166" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="16" y="168" width="200" height="86" rx="8" style="fill:var(--ref);stroke:var(--ref)" fill-opacity="0.1" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="28" y="189">Human mode (default)</text>
  <text class="s m" x="28" y="208">a person drives with the</text>
  <text class="s m" x="28" y="224">remote; the script shows</text>
  <text class="s m" x="28" y="240">live mocap feedback</text>
  <text class="s m" x="16" y="404">Autonomous mode drives through otto and the MCB; human mode sends nothing to the robot.</text>
</svg>
