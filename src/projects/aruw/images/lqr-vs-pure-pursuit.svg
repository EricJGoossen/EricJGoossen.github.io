<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" role="img" aria-labelledby="t d">
  <title id="t">LQR against pure pursuit on three paths</title>
  <desc id="d">Both controllers on the same simulated chassis and the same three paths, at the same 2 m/s top speed. slalom, 11.7 m: pure pursuit 10.7 s and 46 cm at worst, LQR 8.6 s and 3.2 cm. square, 11.1 m: pure pursuit 8.1 s and 33 cm at worst, LQR 6.7 s and 2.4 cm. engineer&#x27;s drive, 3.0 m: pure pursuit 4.0 s and 33 cm at worst, LQR 2.5 s and 2.4 cm.</desc>
  <style>
    svg { --text:#1c1917; --muted:#6b6560; --grid:#e7e5e4; --axis:#a8a29e;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#6250d6; --ref:#78716c; }
    @media screen {
      svg { --text:#f2f1ef; --muted:#a39d97; --grid:#33312e; --axis:#57534e;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9; --ref:#a8a29e; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); font-size: 13px; }
    .m { fill: var(--muted); } .s { font-size: 12px; } .b { font-weight: 650; }
    .e { text-anchor: end; } .c { text-anchor: middle; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dash { stroke-dasharray: 6 4; }
    .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <text class="s m" x="104.0" y="56.0" text-anchor="start">time to finish (s)</text>
  <line class="grid" x1="104.0" x2="104.0" y1="66" y2="210"/>
  <text class="s m" x="104.0" y="224.0" text-anchor="middle">0</text>
  <line class="grid" x1="179.3" x2="179.3" y1="66" y2="210"/>
  <text class="s m" x="179.3" y="224.0" text-anchor="middle">4</text>
  <line class="grid" x1="254.7" x2="254.7" y1="66" y2="210"/>
  <text class="s m" x="254.7" y="224.0" text-anchor="middle">8</text>
  <line class="grid" x1="330.0" x2="330.0" y1="66" y2="210"/>
  <text class="s m" x="330.0" y="224.0" text-anchor="middle">12</text>
  <rect x="104" y="70" width="201.7" height="13" rx="2" style="fill:var(--s2)"/>
  <text class="s" x="310.7" y="81.0" text-anchor="start">10.7</text>
  <rect x="104" y="86" width="161.8" height="13" rx="2" style="fill:var(--s1)"/>
  <text class="s" x="270.8" y="97.0" text-anchor="start">8.6</text>
  <text class="s" x="94.0" y="82.0" text-anchor="end">slalom</text>
  <text class="s m" x="94.0" y="97.0" text-anchor="end">11.7 m</text>
  <rect x="104" y="120" width="153.3" height="13" rx="2" style="fill:var(--s2)"/>
  <text class="s" x="262.3" y="131.0" text-anchor="start">8.1</text>
  <rect x="104" y="136" width="125.2" height="13" rx="2" style="fill:var(--s1)"/>
  <text class="s" x="234.2" y="147.0" text-anchor="start">6.7</text>
  <text class="s" x="94.0" y="132.0" text-anchor="end">square</text>
  <text class="s m" x="94.0" y="147.0" text-anchor="end">11.1 m</text>
  <rect x="104" y="170" width="76.3" height="13" rx="2" style="fill:var(--s2)"/>
  <text class="s" x="185.3" y="181.0" text-anchor="start">4.0</text>
  <rect x="104" y="186" width="47.1" height="13" rx="2" style="fill:var(--s1)"/>
  <text class="s" x="156.1" y="197.0" text-anchor="start">2.5</text>
  <text class="s" x="94.0" y="182.0" text-anchor="end">engineer's drive</text>
  <text class="s m" x="94.0" y="197.0" text-anchor="end">3.0 m</text>
  <text class="s m" x="368.0" y="56.0" text-anchor="start">farthest from the path (cm)</text>
  <line class="grid" x1="368.0" x2="368.0" y1="66" y2="210"/>
  <text class="s m" x="368.0" y="224.0" text-anchor="middle">0</text>
  <line class="grid" x1="474.0" x2="474.0" y1="66" y2="210"/>
  <text class="s m" x="474.0" y="224.0" text-anchor="middle">25</text>
  <line class="grid" x1="580.0" x2="580.0" y1="66" y2="210"/>
  <text class="s m" x="580.0" y="224.0" text-anchor="middle">50</text>
  <rect x="368" y="70" width="195.9" height="13" rx="2" style="fill:var(--s2)"/>
  <text class="s" x="568.9" y="81.0" text-anchor="start">46</text>
  <rect x="368" y="86" width="13.6" height="13" rx="2" style="fill:var(--s1)"/>
  <text class="s" x="386.6" y="97.0" text-anchor="start">3.2</text>
  <rect x="368" y="120" width="138.6" height="13" rx="2" style="fill:var(--s2)"/>
  <text class="s" x="511.6" y="131.0" text-anchor="start">33</text>
  <rect x="368" y="136" width="10.2" height="13" rx="2" style="fill:var(--s1)"/>
  <text class="s" x="383.2" y="147.0" text-anchor="start">2.4</text>
  <rect x="368" y="170" width="138.2" height="13" rx="2" style="fill:var(--s2)"/>
  <text class="s" x="511.2" y="181.0" text-anchor="start">33</text>
  <rect x="368" y="186" width="10.2" height="13" rx="2" style="fill:var(--s1)"/>
  <text class="s" x="383.2" y="197.0" text-anchor="start">2.4</text>
  <rect x="104" y="12" width="12" height="12" rx="2" style="fill:var(--s2)"/>
  <text class="s" x="122.0" y="23.0" text-anchor="start">pure pursuit (the team's)</text>
  <rect x="304" y="12" width="12" height="12" rx="2" style="fill:var(--s1)"/>
  <text class="s" x="322.0" y="23.0" text-anchor="start">LQR</text>
</svg>
