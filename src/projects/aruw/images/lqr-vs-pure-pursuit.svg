  <rect x="56" y="14" width="14" height="14" rx="2" style="fill:var(--s2)"/>
  <text class="s" x="76.0" y="26.0" text-anchor="start">pure pursuit (the team's)</text>
  <rect x="260" y="14" width="14" height="14" rx="2" style="fill:var(--s1)"/>
  <text class="s" x="280.0" y="26.0" text-anchor="start">LQR</text>
