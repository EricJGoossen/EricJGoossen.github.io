<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
  <title id="t">The error model&#x27;s hold-out check: every axis passes</title>
  <desc id="d">For each axis, the Odin1&#x27;s real RMSE on a held-out 40 s session (dot) against the range the error model predicts for that session (bar: 5th to 95th percentile of 200 simulated runs along the same trajectory). Position: along-track 3.40 cm (predicted 0.83-3.54), cross-track 3.85 cm (0.86-8.93), vertical 0.59 cm (0.55-4.83). Rotation: roll 0.25 degrees (0.32-1.27), pitch 0.45 (0.26-1.61), yaw 0.33 (0.22-0.99). Every axis passes the rank test (family-wise alpha 0.10); roll sits just under its band.</desc>
  <style>
    svg { --text:#1c1917; --muted:#6b6560; --grid:#e7e5e4; --axis:#a8a29e;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#6250d6; --ref:#78716c; }
    @media screen {
      svg { --text:#f2f1ef; --muted:#a39d97; --grid:#33312e; --axis:#57534e;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9; --ref:#a8a29e; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); font-size: 13px; }
    .m { fill: var(--muted); } .s { font-size: 12px; } .b { font-weight: 650; }
    .e { text-anchor: end; } .c { text-anchor: middle; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dash { stroke-dasharray: 6 4; }
    .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
