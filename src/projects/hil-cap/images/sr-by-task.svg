<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 390" role="img" aria-labelledby="t d">
  <title id="t">Success rate by task: four VLAs against LLM-written code</title>
  <desc id="d">Success rates from the paper&#x27;s real-world benchmark on a Franka Panda, 10 rollouts per task. The four VLAs (π0, π0.5, MolmoAct2, GR00T N1.7) do well only on simple pick and place, led by π0.5 with 0.9 on banana to plate and 1.0 on block to basket, and score 0 to 0.1 on closing a drawer, folding a cloth and the banana under a cloth. Code as Policies scores at most 0.6. ARCHITECT, with human corrections, scores 0.7 to 1.0 on every task.</desc>
