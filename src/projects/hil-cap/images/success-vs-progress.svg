<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 370" role="img" aria-labelledby="t d">
  <title id="t">How far the VLAs got, not just whether they finished</title>
  <desc id="d">For π0 and π0.5 on each of the eight tasks, success rate beside normalized task progression, the share of a task&#x27;s rubric steps completed. On the hard tasks success is 0 to 0.1 but progression is often higher: π0 reaches 0.40 of the cloth fold and 0.36 of the banana under a cloth while succeeding 0 and 0.1 of the time, and π0.5 gets halfway through the baseball task while succeeding 0.2 of the time.</desc>
