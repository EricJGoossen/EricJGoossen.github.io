<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" role="img" aria-labelledby="t d">
  <title id="t">The evaluation harness</title>
  <desc id="d">YAML configs feed run_eval.py, which drives the DROID Franka robot, asks one policy client for chunks of actions, and has the operator score each rollout. The client talks to π0 and π0.5 over WebSocket, GR00T N1.7 over ZMQ and MolmoAct2 over HTTP. Each rollout&#x27;s scores and camera videos go to a results folder, and compute_results.py turns them into per-policy CSVs by task and by prompt.</desc>
  <style>
    svg { --text:#1c1917; --muted:#6b6560; --grid:#e7e5e4; --axis:#a8a29e;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#6250d6; --ref:#78716c; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#f2f1ef; --muted:#a39d97; --grid:#33312e; --axis:#57534e;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9085e9; --ref:#a8a29e; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); font-size: 13px; }
    .m { fill: var(--muted); } .s { font-size: 12px; } .b { font-weight: 650; }
    .e { text-anchor: end; } .c { text-anchor: middle; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dash { stroke-dasharray: 6 4; }
    .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--axis)"/></marker></defs>
  <rect x="16" y="16" width="180" height="86" rx="8" style="fill:var(--ref);stroke:var(--ref)" fill-opacity="0.07" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="28" y="37">YAML configs</text>
  <text class="s m" x="28" y="56">policy: server, checkpoint,</text>
  <text class="s m" x="28" y="72">action space, chunk size</text>
  <text class="s m" x="28" y="88">task: prompts, rollouts</text>
  <rect x="256" y="16" width="180" height="86" rx="8" style="fill:var(--s1);stroke:var(--s1)" fill-opacity="0.16" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="268" y="37">run_eval.py</text>
  <text class="s m" x="268" y="56">plans episodes, resumes,</text>
  <text class="s m" x="268" y="72">asks the operator to</text>
  <text class="s m" x="268" y="88">score every rollout</text>
  <rect x="526" y="16" width="180" height="86" rx="8" style="fill:var(--s4);stroke:var(--s4)" fill-opacity="0.07" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="538" y="37">DROID robot</text>
  <text class="s m" x="538" y="56">Franka Panda; NUC robot</text>
  <text class="s m" x="538" y="72">server; ZED 2i scene and</text>
  <text class="s m" x="538" y="88">ZED Mini wrist cameras</text>
  <line x1="196" y1="59" x2="254" y2="59" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="436" y1="46" x2="524" y2="46" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="s m" x="480.0" y="40.0" text-anchor="middle">actions</text>
  <line x1="524" y1="74" x2="438" y2="74" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="s m" x="481.0" y="92.0" text-anchor="middle">images, state</text>
  <rect x="246" y="150" width="200" height="70" rx="8" style="fill:var(--s1);stroke:var(--s1)" fill-opacity="0.16" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="258" y="171">Policy client</text>
  <text class="s m" x="258" y="190">one interface: infer(obs, prompt)</text>
  <text class="s m" x="258" y="206">→ a chunk of actions</text>
  <line x1="346" y1="102" x2="346" y2="148" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="16" y="268" width="218" height="54" rx="8" style="fill:var(--s5);stroke:var(--s5)" fill-opacity="0.07" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="28" y="289">π0, π0.5 (openpi)</text>
  <text class="s m" x="28" y="308">policy server over WebSocket</text>
  <line x1="346" y1="220" x2="125" y2="266" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="251" y="268" width="218" height="54" rx="8" style="fill:var(--s5);stroke:var(--s5)" fill-opacity="0.07" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="263" y="289">GR00T N1.7</text>
  <text class="s m" x="263" y="308">policy server over ZMQ</text>
  <line x1="346" y1="220" x2="360" y2="266" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="486" y="268" width="218" height="54" rx="8" style="fill:var(--s5);stroke:var(--s5)" fill-opacity="0.07" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="498" y="289">MolmoAct2</text>
  <text class="s m" x="498" y="308">policy server over HTTP</text>
  <line x1="346" y1="220" x2="595" y2="266" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="16" y="360" width="330" height="78" rx="8" style="fill:var(--s3);stroke:var(--s3)" fill-opacity="0.07" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="28" y="381">results/</text>
  <text class="s m" x="28" y="400">per rollout: success, step score, recall score,</text>
  <text class="s m" x="28" y="416">comments, scene and wrist video</text>
  <rect x="374" y="360" width="330" height="78" rx="8" style="fill:var(--s3);stroke:var(--s3)" fill-opacity="0.07" stroke-opacity="0.7" stroke-width="1.3"/>
  <text class="b" x="386" y="381">compute_results.py</text>
  <text class="s m" x="386" y="400">raw.csv, by_task.csv, by_prompt.csv:</text>
  <text class="s m" x="386" y="416">success rate and scores per policy</text>
  <line x1="346" y1="399" x2="372" y2="399" style="stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 256 92 H 242 V 356" style="fill:none;stroke:var(--axis)" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
